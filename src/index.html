<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sensagotchi</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a14">

    <!-- Primary Meta Tags -->
    <meta name="title" content="Sensagotchi" />
    <meta name="description" content="Simulation framework for modeling limbic and affective dynamics under abstract human actions" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sensagotchi.netlify.app/" />
    <meta property="og:title" content="Sensagotchi" />
    <meta property="og:description" content="Simulation framework for modeling limbic and affective dynamics under abstract human actions" />
    <meta property="og:image" content="https://sensagotchi.netlify.app/preview.png" />

    <!-- X (Twitter) -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://sensagotchi.netlify.app/" />
    <meta property="twitter:title" content="Sensagotchi" />
    <meta property="twitter:description" content="Simulation framework for modeling limbic and affective dynamics under abstract human actions" />
    <meta property="twitter:image" content="https://sensagotchi.netlify.app/preview.png" />
    <link rel="stylesheet" href="style.css">
    <!-- p5.js for procedural avatar -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <!-- Tone.js for procedural audio -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
</head>
<body>
<div id="app">
    <div id="onboarding-overlay">
        <div id="onboarding-card">
            <div class="overlay-kicker" id="onboarding-title">SENSAGOTCHI</div>
            <div class="preset-section preset-section-only">
                <p class="overlay-copy compact" id="preset-copy">
                    Elegí un contexto de arranque. Cambia rasgos globales y el estado base del sistema.
                </p>
                <div id="preset-options"></div>
            </div>
            <button id="start-btn" onclick="dismissOnboarding()">empezar</button>
        </div>
    </div>

    <!-- ── Avatar section ──────────────────────────────── -->
    <div id="avatar-section">
        <div id="bg"></div>

        <button id="reset-btn" onclick="resetGame()">↺ reset</button>
        <div id="top-actions">
            <button id="stats-btn" onclick="toggleStats()">stats</button>
            <a id="lab-btn" href="emotions-expression-test.html">lab →</a>
            <label id="lang-wrap">
                <select id="lang-select" onchange="changeLocale(this.value)">
                    <option value="es">ES</option>
                    <option value="en">EN</option>
                </select>
            </label>
        </div>

        <!-- Event notification overlay -->
        <div id="event-notification"></div>
        <div id="monster-status-banner"></div>

        <!-- Comic thought clouds for hunger and energy -->
        <div id="thought-hunger" class="thought-cloud thought-cloud-right hidden"></div>
        <div id="thought-energy" class="thought-cloud thought-cloud-left  hidden"></div>

        <!-- Health/crit alerts (chips) -->
        <div id="state-callouts"></div>

        <!-- Avatar (p5.js procedural monster) -->
        <div class="avatar-container anim-idle" id="avatar-container">
            <div id="avatar-canvas-wrap"></div>
        </div>

        <!-- Audio toggle -->
        <button id="audio-btn" onclick="toggleAudio()" title="Toggle sound">🔇</button>
    </div>

    <!-- ── Controls panel ───────────────────────────────── -->
    <div id="controls">
        <div id="category-bar">
            <!-- populated by JS -->
        </div>
        <div id="action-area">
            <!-- populated by JS -->
        </div>
    </div>

    <div id="stats-overlay" class="hidden" onclick="toggleStats()">
        <div id="stats-panel" onclick="event.stopPropagation()">
            <button id="stats-close-btn" onclick="toggleStats()">✕</button>
            <div id="hud">
                <div id="hud-detail"></div>
            </div>
        </div>
    </div>

    <!-- ── Death screen ─────────────────────────────────── -->
    <div id="death-screen" class="hidden">
        <div id="death-content">
            <div id="death-skull">☠</div>
            <div id="death-msg">forensic report</div>
            <div id="death-cause"></div>
            <div id="death-summary"></div>
            <div id="death-factors"></div>
            <div id="death-last-actions"></div>
            <button id="death-reset" onclick="resetGame()">↺ start over</button>
        </div>
    </div>

</div><!-- #app -->
    <script src="expressive-engine.js"></script>
    <script src="monster.js"></script>
<script src="main.js" type="module"></script>
<script>
  if (
    'serviceWorker' in navigator &&
    location.hostname !== 'localhost' &&
    location.hostname !== '127.0.0.1'
  ) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
